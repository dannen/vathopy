<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>vathopy</title>
<style>
  :root {
    --bg: #15171a; --panel: #1d2024; --line: #2c3036; --text: #e4e6e9; --dim: #8b929b;
    --accent: #ff7a3c; --focus: #ffb27c; --cut: rgba(255, 50, 50, .45);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font: 13px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; }
  .app { display: grid; grid-template-columns: 320px 1fr; height: 100vh; }
  aside { background: var(--panel); border-right: 1px solid var(--line); overflow-y: auto; padding: 14px 16px 24px; }
  main { position: relative; overflow: auto; display: flex; align-items: center; justify-content: center; }
  h1 { font-size: 15px; margin: 0 0 12px; letter-spacing: .02em; }
  h2 { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--dim); margin: 18px 0 8px; font-weight: 600; }
  select, input[type=text] { width: 100%; background: var(--bg); color: var(--text); border: 1px solid var(--line);
    border-radius: 6px; padding: 6px 8px; font: inherit; }
  .row { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 4px 8px; margin: 8px 0 2px; }
  .row label { color: var(--text); }
  .row .lab { display: flex; align-items: center; gap: 10px; }
  .row label.lock, .maprow label.lock { display: flex; align-items: center; gap: 4px; color: var(--dim); font-size: 11.5px; cursor: pointer; }
  .maprow label.lock { margin-top: 4px; flex: none; }
  .row .lab button.small { margin-top: 0; padding: 1px 7px; }
  .row output { color: var(--focus); font-variant-numeric: tabular-nums; min-width: 3.5em; text-align: right; }
  input[type=range] { grid-column: 1 / -1; width: 100%; accent-color: var(--accent); margin: 0; }
  .slide { grid-column: 1 / -1; display: flex; align-items: center; gap: 2px; }
  .slide input[type=range] { flex: 1; min-width: 0; }
  button.step { background: none; border: 0; color: var(--dim); cursor: pointer; padding: 3px 4px; line-height: 0; flex: none; }
  button.step svg { width: 13px; height: 13px; fill: currentColor; }
  button.step:hover:not(:disabled) { color: var(--text); }
  button.step:disabled { opacity: .3; cursor: not-allowed; }
  .checks { display: flex; gap: 16px; margin: 10px 0 0; }
  .checks label { display: flex; align-items: center; gap: 6px; cursor: pointer; }
  /* 3 rows of swatches: each 38 px (18 bar + 2 + 14 name + 2×2 border), 6 px gaps, padding and border. */
  .swatches { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 6px; max-height: calc(3 * 38px + 2 * 6px + 2 * 6px + 2px);
    overflow-y: auto; overflow-x: hidden; border: 1px solid var(--line); border-radius: 8px; padding: 6px; }
  .swatch { min-width: 0; }
  .swatch { border: 2px solid transparent; border-radius: 6px; padding: 0; cursor: pointer; background: none; text-align: left; }
  .swatch .bar { height: 18px; border-radius: 4px; }
  .swatch .name { display: block; font-size: 10.5px; line-height: 14px; color: var(--dim); padding: 2px 2px 0; white-space: nowrap;
    overflow: hidden; text-overflow: ellipsis; }
  .swatch[aria-pressed=true] { border-color: var(--accent); }
  .swatch[aria-pressed=true] .name { color: var(--text); }
  .swatch:focus-visible, button:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--focus); outline-offset: 1px; }
  button.act { background: var(--accent); color: #1b1006; border: 0; border-radius: 6px; padding: 7px 12px;
    font: inherit; font-weight: 600; cursor: pointer; }
  button.ghost { background: transparent; color: var(--text); border: 1px solid var(--line); border-radius: 6px;
    padding: 6px 10px; font: inherit; cursor: pointer; }
  .inline { display: flex; gap: 8px; align-items: center; margin-top: 8px; }
  .note { color: var(--dim); font-size: 12px; margin-top: 6px; white-space: pre-line; }
  #status { position: fixed; left: calc(320px + 12px); bottom: 10px; z-index: 3; background: rgba(0,0,0,.6); padding: 4px 9px;
    border-radius: 6px; color: var(--dim); font-variant-numeric: tabular-nums; pointer-events: none; }
  #map { padding: 3px; }
  .maprow { display: flex; align-items: flex-start; gap: 8px; }
  .maprow .note { flex: 1; min-width: 0; overflow-wrap: anywhere; }
  button.small { padding: 3px 8px; font-size: 12px; flex: none; margin-top: 4px; }
  #map option { padding: 3px 6px; border-radius: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #map option:checked { background: var(--accent) linear-gradient(var(--accent), var(--accent)); color: #1b1006; }
  .work { display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 10px 12px; max-width: 100%; }
  #title { font-size: 14px; font-weight: 600; color: var(--text); max-width: 100%; overflow-wrap: anywhere; text-align: center; }
  .below { display: flex; flex-direction: column; align-items: center; gap: 6px; }
  .below .btns { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; justify-content: center; }
  .below .orient button { padding: 4px 9px; }
  .below .orient .glyph { font-size: 15px; line-height: 1; margin-right: 4px; }
  #downloaded { margin-top: 0; text-align: center; overflow-wrap: anywhere; }
  .below[hidden] { display: none; }
  #view, #view2 { max-width: 100%; max-height: calc(100vh - 110px); display: block; image-rendering: auto; cursor: zoom-in; }
  #pair { display: flex; gap: 8px; align-items: flex-start; justify-content: center; max-width: 100%; }
  #pair.on #viewbox, #view2 { flex: 0 1 auto; min-width: 0; max-width: calc(50% - 4px); }
  #view2[hidden], #save_local2[hidden], #download2[hidden] { display: none; }
  main.actual { align-items: flex-start; justify-content: flex-start; }
  main.actual .work { align-items: flex-start; max-width: none; }
  main.actual #view, main.actual #view2, main.actual #pair.on #viewbox { max-width: none; max-height: none; cursor: zoom-out; }
  main #view.picking, main #view2.picking { cursor: crosshair; }
  #pick, #download, #save_local, #pairbtn, #download2, #save_local2 { display: inline-flex; align-items: center; gap: 7px; }
  #download .icon, #save_local .icon, #download2 .icon, #save_local2 .icon { width: 18px; height: 18px; stroke: #fff; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; fill: none; flex: none; }
  #pick .plus { width: 20px; height: 20px; stroke: #fff; stroke-width: 3.2; stroke-linecap: round; flex: none; }
  button.ghost[aria-pressed=true] { border-color: var(--accent); color: var(--focus); }
  .band { border: 1px solid var(--line); border-radius: 8px; padding: 2px 8px 8px; margin-top: 8px; }
  .band .head { display: flex; justify-content: space-between; align-items: center; margin-top: 4px; color: var(--dim); }
  .band .head label { display: flex; align-items: center; gap: 4px; cursor: pointer; }
  .band.off .row { opacity: .45; }
  .band.folded .row { display: none; }
  h2 button.sec { display: flex; align-items: center; gap: 6px; width: 100%; background: none; border: 0; padding: 2px 0;
    color: inherit; font: inherit; text-transform: inherit; letter-spacing: inherit; cursor: pointer; text-align: left; }
  h2 button.sec:hover, .band .head button.tri:hover { color: var(--text); }
  h2 .tri, .band .head button.tri { display: inline-block; width: 12px; font-size: 11px; color: var(--dim); }
  .band .head button.tri { background: none; border: 0; padding: 0 4px 0 0; cursor: pointer; font-family: inherit; }
  .band .head label.lock { font-size: 11.5px; margin-left: auto; margin-right: 8px; }
  .band.locked .row { opacity: .55; }
  .band.locked .row input[type=range] { cursor: not-allowed; }
  .band .head button.remove:disabled { opacity: .3; cursor: not-allowed; }
  .band.folded { padding-bottom: 2px; }
  .band .head .fold { font-variant-numeric: tabular-nums; }
  .band { border-width: 2px; }
  .band .head .dot { display: inline-block; width: 26px; height: 14px; border-radius: 4px; margin: 0 4px 0 2px;
    box-shadow: inset 0 0 0 1px rgba(0,0,0,.35); }
  .band.off .head .dot { opacity: .35; }
  #tabs { position: fixed; top: 10px; right: 12px; display: flex; background: rgba(0,0,0,.6); border-radius: 8px; padding: 3px; z-index: 2; }
  #tabs[hidden] { display: none; }
  #lensbtn { position: fixed; top: 10px; left: calc(320px + 12px); z-index: 3; display: flex; align-items: center; justify-content: center;
    width: 36px; height: 36px; padding: 0; background: rgba(0,0,0,.6); color: var(--text); border: 1px solid transparent; border-radius: 8px; cursor: pointer; }
  #lensbtn svg { width: 20px; height: 20px; stroke: currentColor; stroke-width: 2.2; fill: none; stroke-linecap: round; }
  #lensbtn[aria-pressed=true] { background: var(--accent); color: #1b1006; }
  #lensbtn:hover { border-color: var(--accent); }
  #lens { position: fixed; width: 200px; height: 200px; margin: -100px 0 0 -100px; border-radius: 50%; z-index: 4; pointer-events: none;
    border: 2px solid var(--focus); box-shadow: 0 4px 18px rgba(0,0,0,.6); background-repeat: no-repeat; background-color: var(--bg);
    image-rendering: pixelated; }
  #lens[hidden] { display: none; }
  #lens span { position: absolute; left: 50%; bottom: 10px; transform: translateX(-50%); background: rgba(0,0,0,.6); color: var(--text);
    font-size: 11px; padding: 1px 6px; border-radius: 4px; line-height: 1.4; }
  #tabs button { background: none; border: 0; color: var(--dim); font: inherit; padding: 5px 12px; border-radius: 6px; cursor: pointer; }
  #tabs button[aria-selected=true] { background: var(--accent); color: #1b1006; font-weight: 600; }
  .band .head button { background: none; border: 0; color: var(--dim); cursor: pointer; font: inherit; padding: 2px 4px; }
  #empty { color: var(--dim); }
  #viewbox { position: relative; overflow: hidden; line-height: 0; max-width: 100%; }
  main.actual #viewbox { max-width: none; }
  #cropshade { position: absolute; pointer-events: none; box-shadow: 0 0 0 100000px var(--cut); outline: 1px solid var(--focus); }
  #cropshade[hidden] { display: none; }
  .crop { display: grid; grid-template-columns: 52px 1fr 34px; align-items: center; gap: 4px; margin: 5px 0; }
  .crop .val { text-align: right; color: var(--focus); font-variant-numeric: tabular-nums; }
  .crop .btns { display: flex; gap: 2px; }
  .crop .btns button { flex: 1; background: var(--bg); color: var(--text); border: 1px solid var(--line); border-radius: 4px;
    padding: 3px 0; font: inherit; font-size: 11.5px; cursor: pointer; font-variant-numeric: tabular-nums; }
  .crop .btns button.minus { color: var(--dim); }
  .crop .btns button:hover { border-color: var(--accent); }
  .loupes { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-top: 8px; }
  .loupes figure { margin: 0; text-align: center; }
  .loupes canvas { width: 100%; aspect-ratio: 1; image-rendering: pixelated; display: block; background: var(--bg);
    border: 1px solid var(--line); border-radius: 4px; }
  .loupes figcaption { color: var(--dim); font-size: 11px; margin-top: 2px; }
  #crop_save, #crop_download { display: inline-flex; align-items: center; gap: 7px; white-space: nowrap; }
  #crop_save .icon, #crop_download .icon { width: 16px; height: 16px; stroke: currentColor; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; fill: none; flex: none; }
  button:disabled { opacity: .45; cursor: not-allowed; }
  @media (max-width: 720px) {
    .app { grid-template-columns: 1fr; grid-template-rows: auto 1fr; height: auto; }
    aside { border-right: 0; border-bottom: 1px solid var(--line); }
    #view { max-height: none; }
    #status { left: 12px; }
    #lensbtn { left: 12px; top: auto; bottom: 44px; }
  }
</style>
</head>
<body>
<div class="app">
  <aside>
    <h1>vathopy</h1>
    <select id="map" size="10" aria-label="Depth map (up/down arrows move to the next)"></select>
    <div class="maprow"><div class="note" id="folder"></div>
      <button type="button" class="ghost small" id="refresh" title="Look for new depth maps in the folder">Refresh</button></div>

    <h2>Palette</h2>
    <div class="swatches" id="swatches" role="group" aria-label="Palette"></div>
    <div class="row" title="Moves the palette's colours along its stops, one stop per step; the colour pushed off one end comes back in at the other (the selected swatch shows the result)">
      <span class="lab"><label for="shift">Shift colours</label>
      <button type="button" class="ghost small" id="shift_reset" title="Set the shift back to 0">Reset</button></span><output id="shift_v"></output>
      <input type="range" id="shift" min="0" max="1" step="1" value="0"></div>
    <div class="checks">
      <label><input type="checkbox" id="invert"> Invert</label>
      <label><input type="checkbox" id="equalize"> Equalize</label>
    </div>

    <h2>Shape</h2>
    <div class="row"><label for="cycles">Cycles</label><output id="cycles_v"></output>
      <input type="range" id="cycles" min="0" max="10" step="0.25" value="2"></div>
    <div class="row" title="Fine-tunes Cycles: adds or subtracts up to 0.25 in 0.05 steps. Moving Cycles sets it back to 0 unless it's locked">
      <span class="lab"><label for="cycles_fine">Cycles fine</label>
      <label class="lock" title="Keep Cycles fine when Cycles moves (and stop it being changed by accident)"><input type="checkbox" id="cycles_fine_lock"> Lock</label></span><output id="cycles_fine_v"></output>
      <input type="range" id="cycles_fine" min="-0.25" max="0.25" step="0.05" value="0"></div>
    <div class="row"><label for="contours">Contour lines</label><output id="contours_v"></output>
      <input type="range" id="contours" min="0" max="10" step="0.25" value="0"></div>
    <div class="row"><label for="contour_strength">Line darkness</label><output id="contour_strength_v"></output>
      <input type="range" id="contour_strength" min="0" max="1" step="0.05" value="0"></div>
    <div class="row"><label for="contour_width">Line width (px)</label><output id="contour_width_v"></output>
      <input type="range" id="contour_width" min="0.5" max="8" step="0.5" value="1"></div>

    <h2>Focus</h2>
    <select id="focus_style" aria-label="Focus style">
      <option value="off">Off</option>
      <option value="white_on_black">White on black</option>
      <option value="black_on_white">Black on white</option>
      <option value="light">Lift over the palette</option>
      <option value="dark">Sink over the palette</option>
    </select>
    <div class="inline"><button class="ghost" id="pick" aria-pressed="false"
      title="Then click the picture: that depth becomes a focus (up to 16). Shift-click to keep picking."><svg class="plus" viewBox="0 0 20 20" aria-hidden="true"><path d="M10 2v16M2 10h16"/></svg>Pick a depth</button>
      <span class="note" id="focus_note"></span></div>
    <div id="bands"></div>

    <h2>Quality</h2>
    <div class="row"><label for="smooth">Smoothing (px)</label><output id="smooth_v"></output>
      <input type="range" id="smooth" min="0" max="12" step="0.5" value="0"></div>
    <div class="row"><label for="supersample">Anti-aliasing</label><output id="supersample_v"></output>
      <input type="range" id="supersample" min="1" max="4" step="1" value="2"></div>
    <div class="inline"><button class="ghost" id="auto" title="Probe this depth map and set smoothing and the cycle/contour count to the most it carries cleanly">Auto (probe)</button></div>
    <div class="note" id="probe"></div>

    <h2>Looks</h2>
    <select id="looks" aria-label="Load a saved look"><option value="">Load a saved look…</option></select>
    <div class="inline"><input type="text" id="name" placeholder="name for this look" aria-label="Look name">
      <button class="act" id="save">Save</button></div>
    <div class="note" id="saved"></div>
    <div class="inline"><button class="ghost" id="export_settings" title="Download every setting on the page (and the look) as a .vathopy.json file">Export settings</button>
      <button class="ghost" id="load_file" title="Load the settings from a PNG or JPG vathopy saved, an exported .vathopy.json, or a look .json (several files: the first that has them)">Load from file…</button>
      <input type="file" id="load_input" accept=".json,.png,.jpg,.jpeg,application/json,image/png,image/jpeg" multiple hidden></div>
    <div class="note" id="loaded"></div>

    <h2>Crop</h2>
    <div class="note" style="margin-top:0">Pixels cut off each side of the depth map (red on the picture).</div>
    <div id="crop_sides"></div>
    <div class="loupes" id="loupes" title="Each corner of the crop, 24 px of the map across"></div>
    <div class="maprow"><div class="note" id="crop_size"></div>
      <label class="lock" title="Keep this crop when another depth map is picked (otherwise it goes back to 0)"><input type="checkbox" id="crop_lock"> Lock</label>
      <button type="button" class="ghost small" id="crop_reset" title="Set every side back to 0">Reset</button></div>
    <div class="inline"><button class="ghost" id="crop_save" title="Write <map>-cropped.exr into the depth-map folder on the machine running vathopy (replaces an earlier crop of this map)" disabled>
      <svg class="icon" viewBox="0 0 20 20" aria-hidden="true"><path d="M4 3.5h9.5L16.5 6.5v10h-12.5zM7 3.5v4h6v-4M7 16.5v-5h6v5"/></svg>Save local</button>
      <button class="ghost" id="crop_download" title="Download <map>-cropped.exr to this browser; nothing is written on the server" disabled>
      <svg class="icon" viewBox="0 0 20 20" aria-hidden="true"><path d="M10 3v10M5.5 8.5 10 13l4.5-4.5M4 16.5h12"/></svg>Download EXR</button></div>
    <div class="note" id="crop_note"></div>
  </aside>
  <main id="stage"><div class="work">
    <div id="title"></div>
    <span id="empty">Loading…</span><div id="pair"><div id="viewbox"><img id="view" alt="" hidden><div id="cropshade" hidden></div></div><img id="view2" alt="" hidden></div>
    <div class="below" id="below" hidden><div class="btns"><button class="ghost" id="save_local" title="Save the full-quality result as a 16-bit PNG in the favourites folder on the machine running vathopy">
      <svg class="icon" viewBox="0 0 20 20" aria-hidden="true"><path d="M4 3.5h9.5L16.5 6.5v10h-12.5zM7 3.5v4h6v-4M7 16.5v-5h6v5"/></svg>Save local</button>
      <button class="ghost" id="download" title="Download the full-quality result as a 16-bit PNG">
      <svg class="icon" viewBox="0 0 20 20" aria-hidden="true"><path d="M10 3v10M5.5 8.5 10 13l4.5-4.5M4 16.5h12"/></svg>Download PNG</button>
      <button class="ghost" id="save_local2" hidden title="Save the inverse (right) at full quality as a 16-bit PNG in the favourites folder, named …_inverse">
      <svg class="icon" viewBox="0 0 20 20" aria-hidden="true"><path d="M4 3.5h9.5L16.5 6.5v10h-12.5zM7 3.5v4h6v-4M7 16.5v-5h6v5"/></svg>Save inverse</button>
      <button class="ghost" id="download2" hidden title="Download the inverse (right) at full quality as a 16-bit PNG, named …_inverse">
      <svg class="icon" viewBox="0 0 20 20" aria-hidden="true"><path d="M10 3v10M5.5 8.5 10 13l4.5-4.5M4 16.5h12"/></svg>Download inverse</button>
      <button class="ghost" id="pairbtn" aria-pressed="false" title="Show the inverse (Invert flipped) beside the picture">Side by side</button></div>
      <div class="btns orient" role="group" aria-label="Orientation">
      <button class="ghost" id="rot_ccw" title="Turn the picture 90° counter-clockwise"><span class="glyph" aria-hidden="true">⟲</span>90°</button>
      <button class="ghost" id="rot_cw" title="Turn the picture 90° clockwise"><span class="glyph" aria-hidden="true">⟳</span>90°</button>
      <button class="ghost" id="flip_lr" title="Flip the picture left to right"><span class="glyph" aria-hidden="true">⇆</span>Flip</button>
      <button class="ghost" id="flip_ud" title="Flip the picture upside down"><span class="glyph" aria-hidden="true">⇅</span>Flip</button>
      <button class="ghost" id="orient_reset" title="Back to the depth map's own orientation">Reset</button></div>
      <div class="note" id="downloaded"></div></div>
  </div></main>
</div>
<div id="status"></div>
<button type="button" id="lensbtn" aria-pressed="false" title="Magnifier (Z): a 200 px lens over the picture that follows the mouse; scroll to change its zoom"
  aria-label="Magnifier"><svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="8.5" cy="8.5" r="5.5"/><path d="M12.6 12.6 17.5 17.5"/></svg></button>
<div id="lens" hidden><span></span></div>
<div id="tabs" role="tablist" aria-label="View" hidden title="T toggles">
  <button type="button" role="tab" data-view="highlight" aria-selected="false">Highlights</button>
  <button type="button" role="tab" data-view="result" aria-selected="true">Result</button>
</div>

<script>
const $ = (id) => document.getElementById(id);
const sliders = ["shift", "cycles", "cycles_fine", "contours", "contour_strength", "contour_width", "smooth", "supersample"];
let palette = "FRINGE";
const fmt = {
  shift: (v) => (+v === 0 ? "0" : `${+v > 0 ? "▶ " : "◀ "}${Math.abs(+v)}`),
  cycles: (v) => (+v === 0 ? "off" : (+v).toString()),
  cycles_fine: (v) => (+$("cycles").value === 0 ? "off" : `${+v > 0 ? "+" : +v < 0 ? "−" : "±"}${Math.abs(+v).toFixed(2)} → ${cyclesTotal()}`),
  contours: (v) => (+v === 0 ? "off" : (+v).toString()),
  contour_strength: (v) => (+v).toFixed(2),
  contour_width: (v) => (+v).toString(),
  smooth: (v) => (+v === 0 ? "off" : (+v).toString()),
  supersample: (v) => (+v === 1 ? "off" : `${v}×`),
};

// Focus bands: [{depth, width, softness}], fractions of the depth range (0 = far, 1 = near).
let bands = [];
// The picture's orientation (the look's): `turns` quarter turns counter-clockwise, then mirrored
// left-right if `mirror`. Focus points and the crop stay in the depth map's own coordinates; the
// helpers below translate between those and the picture as shown.
let orientation = { turns: 0, mirror: false };
const FOCUS_COLOURS = ["#ff7a3c", "#2ec4ff", "#c64bff", "#7ddc3a", "#ffd60a", "#ff4da6", "#00bfa5", "#e62828",
                       "#466eff", "#c49628", "#82ffbe", "#dc00ff", "#8cdcff", "#ff9682", "#c8f01e", "#b4a0ff"];  // as gui.py
const MAX_FOCUS = FOCUS_COLOURS.length;
// The picture shown: "result", or "highlight" (the look without its focus, each focus tinted).
let view = "result";
function setView(v, render = true) {
  if (!bands.length) v = "result";
  const changed = v !== view;
  view = v;
  $("tabs").hidden = !bands.length;

    a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 10000);
    $("loaded").textContent = "Exported " + name;
  } catch (e) { $("loaded").textContent = "export failed: " + e.message; }
};
// Load from file: each chosen file goes to the server, which finds the settings in it; the first
// file that has them wins. Its depth map is selected when it's in the list (focus depths belong to it).
$("load_file").onclick = () => $("load_input").click();
$("load_input").onchange = async () => {
  const files = [...$("load_input").files];
  $("load_input").value = "";
  if (!files.length) return;
  $("loaded").textContent = "reading…";
  const fails = [];
  for (const f of files) {
    try {
      const r = await fetch("/api/read_settings", { method: "POST", headers: { "Content-Type": "application/octet-stream" }, body: f });
      const j = await r.json();
      if (!r.ok) throw new Error(j.error || r.statusText);
      if (j.map_listed && j.map !== $("map").value) {
        $("map").value = j.map; $("map").dispatchEvent(new Event("change"));
      }
      applySettings(j.settings, j.name);
      $("loaded").textContent = `Loaded ${j.kind === "look" ? "the look" : "the settings"} from ${f.name} (${j.source})`
        + (j.map && !j.map_listed ? `.\nIt was made from ${j.map}, which isn't in this folder: applied to ${$("map").value}.` : "")
        + (j.map_listed ? ` · ${j.map}` : "");
      return;
    } catch (e) { fails.push(`${f.name}: ${e.message}`); }
  }
  $("loaded").textContent = "load failed: " + fails.join("; ");
};

$("save").onclick = async () => {
  $("saved").textContent = "saving…";
  try {
    const j = await getJSON("/api/save", { map: $("map").value, settings: settings(), name: $("name").value });
    $("saved").innerHTML = "";
    $("saved").append("Saved: ");
    for (const [label, url] of [["PNG", j.png_url], ["look", j.look_url]]) {
      const link = document.createElement("a");
      link.href = url; link.textContent = "download " + label; link.style.color = "var(--focus)";
      $("saved").append(link, "  ");
    }
    await loadLooks();
  } catch (e) { $("saved").textContent = "save failed: " + e.message; }
};

// What Save local / Download PNG send: the picture, or (inverse) the one beside it, named …_inverse.
function exportRequest(inverse) {
  const s = settings();
  if (!inverse) return { map: $("map").value, settings: s, name: $("name").value };
  return { map: $("map").value, settings: { ...s, invert: !s.invert }, name: ($("name").value.trim() || "vathopy") + "_inverse" };
}
async function saveLocal(btn, inverse) {
  btn.disabled = true; $("downloaded").textContent = "saving the PNG…";
  try {
    const j = await getJSON("/api/save_local", exportRequest(inverse));
    $("downloaded").textContent = "Saved " + j.png;
  } catch (e) { $("downloaded").textContent = "save failed: " + e.message; }
  finally { btn.disabled = false; }
}
async function downloadPNG(btn, inverse) {
  btn.disabled = true; $("downloaded").textContent = "rendering the PNG…";
  try {
    const r = await fetch("/api/export", { method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify(exportRequest(inverse)) });
    if (!r.ok) throw new Error((await r.json()).error);
    const name = (r.headers.get("Content-Disposition") || "").match(/filename="([^"]+)"/)?.[1] || "vathopy.png";
    const url = URL.createObjectURL(await r.blob());
    const a = document.createElement("a");
    a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 10000);
    $("downloaded").textContent = "Downloaded " + name;
  } catch (e) { $("downloaded").textContent = "download failed: " + e.message; }
  finally { btn.disabled = false; }
}
for (const [id, fn, inverse] of [["save_local", saveLocal, false], ["save_local2", saveLocal, true],
                                 ["download", downloadPNG, false], ["download2", downloadPNG, true]])
  $(id).onclick = () => fn($(id), inverse);

// Crop: pixels cut off each side of the map. The picture gets a red shade over what goes and the
// loupes show each corner of what stays; saving/downloading crops the map's EXR itself (all channels).
const CROP_SIDES = ["top", "right", "bottom", "left"], CROP_STEPS = [-10, -5, -1, 1, 5, 10];
const OPPOSITE = { top: "bottom", bottom: "top", left: "right", right: "left" };
const LOUPE_PX = 24, LOUPES = [["top", "left", "Top left"], ["top", "right", "Top right"],
                               ["bottom", "left", "Bottom left"], ["bottom", "right", "Bottom right"]];
let crop = { top: 0, right: 0, bottom: 0, left: 0 }, mapSize = null;   // in the map's own orientation
const cropOn = () => CROP_SIDES.some((k) => crop[k] > 0);
// Where a side of the map ends up in the picture: each quarter turn counter-clockwise moves top to
// left, left to bottom, bottom to right, right to top; the mirror swaps left and right.
const CCW = { top: "left", left: "bottom", bottom: "right", right: "top" };
function shownSide(k) {
  for (let i = 0; i < orientation.turns; i++) k = CCW[k];
  return orientation.mirror ? ({ left: "right", right: "left" }[k] || k) : k;
}
const mapSide = (k) => CROP_SIDES.find((m) => shownSide(m) === k);
const shownCrop = () => Object.fromEntries(CROP_SIDES.map((k) => [k, crop[mapSide(k)]]));
const shownSize = () => (mapSize && orientation.turns % 2 ? { w: mapSize.h, h: mapSize.w } : mapSize);
// A point on the picture (fractions, top-down) -> the same point on the map: undo the mirror, then
// turn back clockwise (a counter-clockwise turn takes map (x, y) to (y, 1 - x)).
function mapPoint(x, y) {
  if (orientation.mirror) x = 1 - x;
  for (let i = 0; i < orientation.turns; i++) [x, y] = [1 - y, x];
  return [x, y];
}
// Rotate/flip compose onto (turns, mirror): with the mirror on, a turn goes the other way; an
// upside-down flip is a half turn plus a mirror.
function setOrientation(o, render = true) {
  orientation = { turns: (((+o.turns || 0) % 4) + 4) % 4, mirror: !!o.mirror };
  $("orient_reset").disabled = !orientation.turns && !orientation.mirror;
  for (const id of ["rot_ccw", "rot_cw", "flip_lr", "flip_ud", "orient_reset"])
    $(id).setAttribute("aria-label", $(id).title + (orientation.turns || orientation.mirror
      ? ` (now ${orientation.turns * 90}° counter-clockwise${orientation.mirror ? ", mirrored" : ""})` : ""));
  showCrop();
  if (render) full();
}
const turn = (d) => setOrientation({ turns: orientation.turns + (orientation.mirror ? -d : d), mirror: orientation.mirror });
$("rot_ccw").onclick = () => turn(1);
$("rot_cw").onclick = () => turn(-1);
$("flip_lr").onclick = () => setOrientation({ turns: orientation.turns, mirror: !orientation.mirror });
$("flip_ud").onclick = () => setOrientation({ turns: orientation.turns + 2, mirror: !orientation.mirror });
$("orient_reset").onclick = () => setOrientation({});
function cropStepButtons(box, sides, label) {
  for (const n of CROP_STEPS) {
    const b = document.createElement("button");
    b.type = "button"; b.textContent = (n > 0 ? "+" : "−") + Math.abs(n);
    if (n < 0) b.className = "minus";
    b.setAttribute("aria-label", `${label}: ${n > 0 ? "cut" : "give back"} ${Math.abs(n)} px`);
    b.onclick = () => {                               // sides as shown on the picture
      for (const k of sides) crop[mapSide(k)] = Math.max(0, crop[mapSide(k)] + n);
      clampCrop(); $("crop_note").textContent = "";
    };
    box.appendChild(b);
  }
}
for (const [k, label] of [...CROP_SIDES.map((k) => [k, k[0].toUpperCase() + k.slice(1)]), ["all", "All"]]) {
  const row = document.createElement("div");
  row.className = "crop";
  row.innerHTML = `<span></span><div class="btns"></div><span class="val"></span>`;
  row.firstChild.textContent = label;
  if (k !== "all") row.querySelector(".val").id = "crop_" + k;
  cropStepButtons(row.querySelector(".btns"), k === "all" ? CROP_SIDES : [k], label);
  $("crop_sides").appendChild(row);
}
for (const [, , label] of LOUPES) {
  const f = document.createElement("figure");
  f.innerHTML = `<canvas width="${LOUPE_PX * 6}" height="${LOUPE_PX * 6}"></canvas><figcaption></figcaption>`;
  f.querySelector("figcaption").textContent = label;
  $("loupes").appendChild(f);
}
// Keep at least 1 px of the map, then redraw.
function clampCrop() {
  if (mapSize) for (const k of CROP_SIDES) {
    const along = k === "top" || k === "bottom" ? mapSize.h : mapSize.w;
    crop[k] = Math.max(0, Math.min(crop[k], along - 1 - crop[OPPOSITE[k]]));
  }
  showCrop();
}
// Everything here is as the picture shows it (turned/mirrored); the saved EXR keeps the map's own orientation.
function showCrop() {
  const c = shownCrop(), size = shownSize(), turned = orientation.turns || orientation.mirror;
  for (const k of CROP_SIDES) $("crop_" + k).textContent = c[k];
  const on = cropOn() && !!mapSize;
  $("crop_save").disabled = $("crop_download").disabled = !on || !$("map").value;
  $("crop_size").textContent = size ? `${size.w} × ${size.h} px → ${size.w - c.left - c.right} × `
    + `${size.h - c.top - c.bottom} px` + (on ? `  ·  saves as ${$("map").value.replace(/\.exr$/i, "")}-cropped.exr`
    + (turned ? " (in the map's own orientation)" : "") : "") : "";
  const sh = $("cropshade");
  sh.hidden = !on;
  if (on) {
    sh.style.left = `${100 * c.left / size.w}%`; sh.style.top = `${100 * c.top / size.h}%`;
    sh.style.width = `${100 * (size.w - c.left - c.right) / size.w}%`;
    sh.style.height = `${100 * (size.h - c.top - c.bottom) / size.h}%`;
  }
  drawLoupes();
}
// LOUPE_PX map pixels around each corner of the crop, from the picture on show (a preview is coarser).
function drawLoupes() {
  const img = $("view"), canvases = $("loupes").querySelectorAll("canvas");
  canvases.forEach((c, i) => {
    const g = c.getContext("2d");
    g.fillStyle = getComputedStyle(document.body).getPropertyValue("--bg"); g.fillRect(0, 0, c.width, c.height);
    const size = shownSize(), cr = shownCrop();
    if (!size || img.hidden || !img.naturalWidth) return;
    const s = img.naturalWidth / size.w, k = c.width / LOUPE_PX;
    const x0 = cr.left, y0 = cr.top, x1 = size.w - cr.right, y1 = size.h - cr.bottom;
    const [v, hz] = LOUPES[i];
    const sx = Math.max(0, Math.min(size.w - LOUPE_PX, (hz === "left" ? x0 : x1) - LOUPE_PX / 2));
    const sy = Math.max(0, Math.min(size.h - LOUPE_PX, (v === "top" ? y0 : y1) - LOUPE_PX / 2));
    g.imageSmoothingEnabled = false;
    g.drawImage(img, sx * s, sy * s, LOUPE_PX * s, LOUPE_PX * s, 0, 0, c.width, c.height);
    const [ax, ay, bx, by] = [(x0 - sx) * k, (y0 - sy) * k, (x1 - sx) * k, (y1 - sy) * k];
    g.fillStyle = getComputedStyle(document.body).getPropertyValue("--cut");
    g.fillRect(0, 0, c.width, ay); g.fillRect(0, by, c.width, c.height - by);
    g.fillRect(0, ay, ax, by - ay); g.fillRect(bx, ay, c.width - bx, by - ay);
    g.strokeStyle = getComputedStyle(document.body).getPropertyValue("--focus"); g.lineWidth = 1;
    g.strokeRect(ax + .5, ay + .5, bx - ax, by - ay);
  });
}
$("view").addEventListener("load", drawLoupes);
$("crop_reset").onclick = () => { for (const k of CROP_SIDES) crop[k] = 0; $("crop_note").textContent = ""; showCrop(); };
$("crop_save").onclick = async () => {
  const btn = $("crop_save");
  btn.disabled = true; $("crop_note").textContent = "cropping…";
  try {
    const j = await getJSON("/api/crop_save", { map: $("map").value, crop });
    $("crop_note").textContent = `${j.replaced ? "Replaced" : "Saved"} ${j.path} (${j.width} × ${j.height} px)`;
    $("refresh").click();                          // list the new map
  } catch (e) { $("crop_note").textContent = "crop failed: " + e.message; }
  finally { showCrop(); }
};
$("crop_download").onclick = async () => {
  const btn = $("crop_download");
  btn.disabled = true; $("crop_note").textContent = "cropping…";
  try {
    const r = await fetch("/api/crop_download", { method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ map: $("map").value, crop }) });
    if (!r.ok) throw new Error((await r.json()).error);
    const name = (r.headers.get("Content-Disposition") || "").match(/filename="([^"]+)"/)?.[1] || "cropped.exr";
    const url = URL.createObjectURL(await r.blob());
    const a = document.createElement("a");
    a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 10000);
    $("crop_note").textContent = "Downloaded " + name;
  } catch (e) { $("crop_note").textContent = "download failed: " + e.message; }
  finally { showCrop(); }
};
setOrientation({}, false);                        // also draws the crop

// Collapsible sidebar sections: a ▾/▸ on the left of each heading, remembered in this browser.
const COLLAPSED_KEY = "vathopy.collapsed";
let collapsed = {};
try { collapsed = JSON.parse(localStorage.getItem(COLLAPSED_KEY) || "{}") || {}; } catch { collapsed = {}; }
for (const h of document.querySelectorAll("aside h2")) {
  const name = h.textContent.trim();
  const body = document.createElement("div");
  body.className = "section";
  while (h.nextElementSibling && h.nextElementSibling.tagName !== "H2") body.appendChild(h.nextElementSibling);
  h.after(body);
  const btn = document.createElement("button");
  btn.type = "button"; btn.className = "sec";
  btn.innerHTML = `<span class="tri" aria-hidden="true"></span>`;
  btn.append(name);
  h.replaceChildren(btn);
  const show = () => {
    const c = !!collapsed[name];
    body.hidden = c;
    btn.setAttribute("aria-expanded", !c);
    btn.title = c ? `Show ${name}` : `Hide ${name}`;
    btn.querySelector(".tri").textContent = c ? "▸" : "▾";
  };
  btn.onclick = () => {
    collapsed[name] = !collapsed[name];
    try { localStorage.setItem(COLLAPSED_KEY, JSON.stringify(collapsed)); } catch { /* not remembered */ }
    show();
  };
  show();
}

init().catch((e) => { $("empty").textContent = "error: " + e.message; });
</script>
</body>
</html>
