<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>vathopy</title>
<style>
  :root {
    --bg: #15171a; --panel: #1d2024; --line: #2c3036; --text: #e4e6e9; --dim: #8b929b;
    --accent: #ff7a3c; --focus: #ffb27c;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font: 13px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; }
  .app { display: grid; grid-template-columns: 320px 1fr; height: 100vh; }
  aside { background: var(--panel); border-right: 1px solid var(--line); overflow-y: auto; padding: 14px 16px 24px; }
  main { position: relative; overflow: auto; display: flex; align-items: center; justify-content: center; }
  h1 { font-size: 15px; margin: 0 0 12px; letter-spacing: .02em; }
  h2 { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--dim); margin: 18px 0 8px; font-weight: 600; }
  select, input[type=text] { width: 100%; background: var(--bg); color: var(--text); border: 1px solid var(--line);
    border-radius: 6px; padding: 6px 8px; font: inherit; }
  .row { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 4px 8px; margin: 8px 0 2px; }
  .row label { color: var(--text); }
  .row output { color: var(--focus); font-variant-numeric: tabular-nums; min-width: 3.5em; text-align: right; }
  input[type=range] { grid-column: 1 / -1; width: 100%; accent-color: var(--accent); margin: 0; }
  .slide { grid-column: 1 / -1; display: flex; align-items: center; gap: 2px; }
  .slide input[type=range] { flex: 1; min-width: 0; }
  button.step { background: none; border: 0; color: var(--dim); cursor: pointer; padding: 3px 4px; line-height: 0; flex: none; }
  button.step svg { width: 13px; height: 13px; fill: currentColor; }
  button.step:hover:not(:disabled) { color: var(--text); }
  button.step:disabled { opacity: .3; cursor: not-allowed; }
  .checks { display: flex; gap: 16px; margin: 10px 0 0; }
  .checks label { display: flex; align-items: center; gap: 6px; cursor: pointer; }
  .swatches { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 6px; max-height: 30vh;
    overflow-y: auto; overflow-x: hidden; border: 1px solid var(--line); border-radius: 8px; padding: 6px; }
  .swatch { min-width: 0; }
  .swatch { border: 2px solid transparent; border-radius: 6px; padding: 0; cursor: pointer; background: none; text-align: left; }
  .swatch .bar { height: 18px; border-radius: 4px; }
  .swatch .name { display: block; font-size: 10.5px; color: var(--dim); padding: 2px 2px 0; white-space: nowrap;
    overflow: hidden; text-overflow: ellipsis; }
  .swatch[aria-pressed=true] { border-color: var(--accent); }
  .swatch[aria-pressed=true] .name { color: var(--text); }
  .swatch:focus-visible, button:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--focus); outline-offset: 1px; }
  button.act { background: var(--accent); color: #1b1006; border: 0; border-radius: 6px; padding: 7px 12px;
    font: inherit; font-weight: 600; cursor: pointer; }
  button.ghost { background: transparent; color: var(--text); border: 1px solid var(--line); border-radius: 6px;
    padding: 6px 10px; font: inherit; cursor: pointer; }
  .inline { display: flex; gap: 8px; align-items: center; margin-top: 8px; }
  .note { color: var(--dim); font-size: 12px; margin-top: 6px; white-space: pre-line; }
  #status { position: fixed; left: calc(320px + 12px); bottom: 10px; z-index: 3; background: rgba(0,0,0,.6); padding: 4px 9px;
    border-radius: 6px; color: var(--dim); font-variant-numeric: tabular-nums; pointer-events: none; }
  #map { padding: 3px; }
  #map option { padding: 3px 6px; border-radius: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #map option:checked { background: var(--accent) linear-gradient(var(--accent), var(--accent)); color: #1b1006; }
  .work { display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 10px 12px; max-width: 100%; }
  #title { font-size: 14px; font-weight: 600; color: var(--text); max-width: 100%; overflow-wrap: anywhere; text-align: center; }
  .below { display: flex; flex-direction: column; align-items: center; gap: 6px; }
  .below .btns { display: flex; align-items: center; gap: 10px; }
  #downloaded { margin-top: 0; text-align: center; overflow-wrap: anywhere; }
  .below[hidden] { display: none; }
  #view { max-width: 100%; max-height: calc(100vh - 110px); display: block; image-rendering: auto; cursor: zoom-in; }
  main.actual { align-items: flex-start; justify-content: flex-start; }
  main.actual .work { align-items: flex-start; max-width: none; }
  main.actual #view { max-width: none; max-height: none; cursor: zoom-out; }
  main #view.picking { cursor: crosshair; }
  #pick, #download, #save_local { display: inline-flex; align-items: center; gap: 7px; }
  #download .icon, #save_local .icon { width: 18px; height: 18px; stroke: #fff; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; fill: none; flex: none; }
  #pick .plus { width: 20px; height: 20px; stroke: #fff; stroke-width: 3.2; stroke-linecap: round; flex: none; }
  button.ghost[aria-pressed=true] { border-color: var(--accent); color: var(--focus); }
  .band { border: 1px solid var(--line); border-radius: 8px; padding: 2px 8px 8px; margin-top: 8px; }
  .band .head { display: flex; justify-content: space-between; align-items: center; margin-top: 4px; color: var(--dim); }
  .band .head label { display: flex; align-items: center; gap: 4px; cursor: pointer; }
  .band.off .row { opacity: .45; }
  .band.folded .row { display: none; }
  h2 button.sec { display: flex; align-items: center; gap: 6px; width: 100%; background: none; border: 0; padding: 2px 0;
    color: inherit; font: inherit; text-transform: inherit; letter-spacing: inherit; cursor: pointer; text-align: left; }
  h2 button.sec:hover, .band .head button.tri:hover { color: var(--text); }
  h2 .tri, .band .head button.tri { display: inline-block; width: 12px; font-size: 11px; color: var(--dim); }
  .band .head button.tri { background: none; border: 0; padding: 0 4px 0 0; cursor: pointer; font-family: inherit; }
  .band .head label.lock { font-size: 11.5px; margin-left: auto; margin-right: 8px; }
  .band.locked .row { opacity: .55; }
  .band.locked .row input[type=range] { cursor: not-allowed; }
  .band .head button.remove:disabled { opacity: .3; cursor: not-allowed; }
  .band.folded { padding-bottom: 2px; }
  .band .head .fold { font-variant-numeric: tabular-nums; }
  .band { border-width: 2px; }
  .band .head .dot { display: inline-block; width: 26px; height: 14px; border-radius: 4px; margin: 0 4px 0 2px;
    box-shadow: inset 0 0 0 1px rgba(0,0,0,.35); }
  .band.off .head .dot { opacity: .35; }
  #tabs { position: fixed; top: 10px; right: 12px; display: flex; background: rgba(0,0,0,.6); border-radius: 8px; padding: 3px; z-index: 2; }
  #tabs[hidden] { display: none; }
  #tabs button { background: none; border: 0; color: var(--dim); font: inherit; padding: 5px 12px; border-radius: 6px; cursor: pointer; }
  #tabs button[aria-selected=true] { background: var(--accent); color: #1b1006; font-weight: 600; }
  .band .head button { background: none; border: 0; color: var(--dim); cursor: pointer; font: inherit; padding: 2px 4px; }
  #empty { color: var(--dim); }
  @media (max-width: 720px) {
    .app { grid-template-columns: 1fr; grid-template-rows: auto 1fr; height: auto; }
    aside { border-right: 0; border-bottom: 1px solid var(--line); }
    #view { max-height: none; }
    #status { left: 12px; }
  }
</style>
</head>
<body>
<div class="app">
  <aside>
    <h1>vathopy</h1>
    <select id="map" size="5" aria-label="Depth map (up/down arrows move to the next)"></select>
    <div class="note" id="folder"></div>

    <h2>Palette</h2>
    <div class="swatches" id="swatches" role="group" aria-label="Palette"></div>
    <div class="checks">
      <label><input type="checkbox" id="invert"> Invert</label>
      <label><input type="checkbox" id="equalize"> Equalize</label>
    </div>

    <h2>Shape</h2>
    <div class="row"><label for="cycles">Cycles</label><output id="cycles_v"></output>
      <input type="range" id="cycles" min="0" max="10" step="0.25" value="2"></div>
    <div class="row"><label for="contours">Contour lines</label><output id="contours_v"></output>
      <input type="range" id="contours" min="0" max="10" step="0.25" value="0"></div>
    <div class="row"><label for="contour_strength">Line darkness</label><output id="contour_strength_v"></output>
      <input type="range" id="contour_strength" min="0" max="1" step="0.05" value="0.85"></div>
    <div class="row"><label for="contour_width">Line width (px)</label><output id="contour_width_v"></output>
      <input type="range" id="contour_width" min="0.5" max="8" step="0.5" value="1"></div>

    <h2>Focus</h2>
    <select id="focus_style" aria-label="Focus style">
      <option value="off">Off</option>
      <option value="white_on_black">White on black</option>
      <option value="black_on_white">Black on white</option>
      <option value="light">Lift over the palette</option>
      <option value="dark">Sink over the palette</option>
    </select>
    <div class="inline"><button class="ghost" id="pick" aria-pressed="false"
      title="Then click the picture: that depth becomes a focus (up to 16). Shift-click to keep picking."><svg class="plus" viewBox="0 0 20 20" aria-hidden="true"><path d="M10 2v16M2 10h16"/></svg>Pick a depth</button>
      <span class="note" id="focus_note"></span></div>
    <div id="bands"></div>

    <h2>Quality</h2>
    <div class="row"><label for="smooth">Smoothing (px)</label><output id="smooth_v"></output>
      <input type="range" id="smooth" min="0" max="12" step="0.5" value="0"></div>
    <div class="row"><label for="supersample">Anti-aliasing</label><output id="supersample_v"></output>
      <input type="range" id="supersample" min="1" max="4" step="1" value="2"></div>
    <div class="inline"><button class="ghost" id="auto" title="Probe this depth map and set smoothing and the cycle/contour count to the most it carries cleanly">Auto (probe)</button></div>
    <div class="note" id="probe"></div>

    <h2>Looks</h2>
    <select id="looks" aria-label="Load a saved look"><option value="">Load a saved look…</option></select>
    <div class="inline"><input type="text" id="name" placeholder="name for this look" aria-label="Look name">
      <button class="act" id="save">Save</button></div>
    <div class="note" id="saved"></div>
  </aside>
  <main id="stage"><div class="work">
    <div id="title"></div>
    <span id="empty">Loading…</span><img id="view" alt="" hidden>
    <div class="below" id="below" hidden><div class="btns"><button class="ghost" id="save_local" title="Save the full-quality result as a 16-bit PNG in the favourites folder on the machine running vathopy">
      <svg class="icon" viewBox="0 0 20 20" aria-hidden="true"><path d="M4 3.5h9.5L16.5 6.5v10h-12.5zM7 3.5v4h6v-4M7 16.5v-5h6v5"/></svg>Save local</button>
      <button class="ghost" id="download" title="Download the full-quality result as a 16-bit PNG">
      <svg class="icon" viewBox="0 0 20 20" aria-hidden="true"><path d="M10 3v10M5.5 8.5 10 13l4.5-4.5M4 16.5h12"/></svg>Download PNG</button></div>
      <div class="note" id="downloaded"></div></div>
  </div></main>
</div>
<div id="status"></div>
<div id="tabs" role="tablist" aria-label="View" hidden title="T toggles">
  <button type="button" role="tab" data-view="highlight" aria-selected="false">Highlights</button>
  <button type="button" role="tab" data-view="result" aria-selected="true">Result</button>
</div>

<script>
const $ = (id) => document.getElementById(id);
const sliders = ["cycles", "contours", "contour_strength", "contour_width", "smooth", "supersample"];
let palette = "FRINGE";
const fmt = {
  cycles: (v) => (+v === 0 ? "off" : (+v).toString()),
  contours: (v) => (+v === 0 ? "off" : (+v).toString()),
  contour_strength: (v) => (+v).toFixed(2),
  contour_width: (v) => (+v).toString(),
  smooth: (v) => (+v === 0 ? "off" : (+v).toString()),
  supersample: (v) => (+v === 1 ? "off" : `${v}×`),
};

// Focus bands: [{depth, width, softness}], fractions of the depth range (0 = far, 1 = near).
let bands = [];
const FOCUS_COLOURS = ["#ff7a3c", "#2ec4ff", "#c64bff", "#7ddc3a", "#ffd60a", "#ff4da6", "#00bfa5", "#e62828",
                       "#466eff", "#c49628", "#82ffbe", "#dc00ff", "#8cdcff", "#ff9682", "#c8f01e", "#b4a0ff"];  // as gui.py
const MAX_FOCUS = FOCUS_COLOURS.length;
// The picture shown: "result", or "highlight" (the look without its focus, each focus tinted).
let view = "result";
function setView(v, render = true) {
  if (!bands.length) v = "result";
  const changed = v !== view;
  view = v;
  $("tabs").hidden = !bands.length;
  for (const b of $("tabs").querySelectorAll("button")) b.setAttribute("aria-selected", b.dataset.view === view);
  if (changed && render) full();
}
const bandSliders = [["depth", "Depth", 0, 1, 0.005], ["width", "Width", 0, 0.5, 0.005], ["softness", "Softness", 0, 0.3, 0.005],
                     ["strength", "Strength", 0, 1, 0.05], ["reach_w", "Reach width", 0, 1, 0.01],
                     ["reach_h", "Reach height", 0, 1, 0.01], ["reach_edge", "Reach edge", 0, 1, 0.05],
                     ["lean", "Lean (°)", -90, 90, 1], ["angle", "Angle (°)", -90, 90, 5]];
const BAND_DEFAULTS = { strength: 1, lean: 0, angle: 0, reach_w: 0, reach_h: 0, reach_edge: 0.5 };   // older looks
const bandText = (key, v) => (key === "strength" && +v === 0 ? "0 · no effect"
  : key === "strength" || key === "reach_edge" ? (+v).toFixed(2)
  : key === "lean" || key === "angle" ? `${+v}°` : (key === "reach_w" || key === "reach_h") && +v === 0 ? "off" : (+v).toFixed(3));
const BAND_TIPS = {
  reach_w: "Confine this focus to an oval around the point you picked: its half-width, as a fraction of the picture (off = everything at that depth)",
  reach_h: "The oval's half-height, as a fraction of the picture (off with width set = a circle)",
  reach_edge: "How soft the oval's edge is: 0 = sharp, 1 = a glow",
  lean: "Tilt the band away from flat, so it cuts across the scene (a shaft of light) through the point you picked; 0 = flat, negative leans the other way, ±90° = upright, a straight stripe that ignores depth",
  angle: "Turns a leaned band around the point you picked: 0° = tips left/right, ±90° = tips up/down; Lean's sign picks which way",
};
// A ◀ and ▶ button either side of every slider, moving it down or up by one step (its own units),
// as if it had been dragged there and released. A click only moves the slider and its value; nothing
// renders until the clicks have stopped for STEP_RENDER_DELAY_MS, then the last setting renders once.
const STEP_RENDER_DELAY_MS = 250;
const STEP_ICON = { "-1": "M7 1 2 5l5 4z", "1": "M3 1l5 4-5 4z" };
function addSteppers(root) {
  for (const input of root.querySelectorAll("input[type=range]")) {
    if (input.parentElement.classList.contains("slide")) continue;
    const wrap = document.createElement("span");
    wrap.className = "slide";
    input.replaceWith(wrap);
    let timer = null;
    const name = input.getAttribute("aria-label") || input.closest(".row")?.querySelector("label")?.textContent || "slider";
    const button = (dir) => {
      const b = document.createElement("button");
      b.type = "button"; b.className = "step";
      b.title = `${dir < 0 ? "Down" : "Up"} one step (${input.step})`;
      b.setAttribute("aria-label", `${name}: ${dir < 0 ? "down" : "up"} one step`);
      b.innerHTML = `<svg viewBox="0 0 10 10" aria-hidden="true"><path d="${STEP_ICON[dir]}"/></svg>`;
      b.onclick = () => {
        const before = input.value;
        dir < 0 ? input.stepDown() : input.stepUp();
        if (input.value === before) return;
        quiet = true;                                  // the slider's own handler, without its preview
        try { input.dispatchEvent(new Event("input")); } finally { quiet = false; }
        clearTimeout(timer);
        timer = setTimeout(() => input.dispatchEvent(new Event("change")), STEP_RENDER_DELAY_MS);
      };
      return b;
    };
    wrap.append(button(-1), input, button(1));
  }
}

function buildBands() {
  const box = $("bands");
  box.innerHTML = "";
  bands.forEach((b, i) => {
    const div = document.createElement("div");
    div.className = "band";
    div.innerHTML = `<div class="head"><button type="button" class="tri"></button>`
      + `<label><input type="checkbox" class="on"> <span class="dot"></span>Focus ${i + 1}</label>`
      + `<label class="lock" title="Lock this focus's sliders so they can't be changed by accident"><input type="checkbox" class="lockbox"> Lock</label>`
      + `<span><button type="button" class="fold"></button><button type="button" class="remove" title="Remove">✕</button></span></div>`;
    b.open ??= true;
    const fold = div.querySelector(".fold"), tri = div.querySelector(".tri");
    const showFold = () => {
      fold.textContent = (+b.depth).toFixed(3);
      tri.textContent = b.open ? "▾" : "▸";
      for (const el of [fold, tri]) {
        el.title = b.open ? "Hide the sliders" : "Show the sliders";
        el.setAttribute("aria-expanded", b.open);
      }
      div.classList.toggle("folded", !b.open);
    };
    fold.onclick = tri.onclick = () => { b.open = !b.open; showFold(); };
    showFold();
    const colour = FOCUS_COLOURS[i % FOCUS_COLOURS.length];      // its tint in the Highlights view
    div.querySelector(".dot").style.background = colour;
    div.querySelector(".dot").title = "Its colour in the Highlights view";
    div.style.borderColor = colour;
    div.style.background = colour + "1f";                        // the same colour, faint
    const on = div.querySelector("input.on");
    b.enabled ??= true;
    on.checked = b.enabled;
    on.setAttribute("aria-label", `Focus ${i + 1} on`);
    div.classList.toggle("off", !b.enabled);
    on.onchange = () => { b.enabled = on.checked; div.classList.toggle("off", !b.enabled); full(); };
    const lock = div.querySelector("input.lockbox");
    b.locked ??= false;
    lock.checked = b.locked;
    lock.setAttribute("aria-label", `Lock focus ${i + 1}`);
    const applyLock = () => {                       // sliders and remove; on/off and folding stay usable
      for (const el of div.querySelectorAll("input[type=range], button.remove, button.step")) el.disabled = b.locked;
      div.classList.toggle("locked", b.locked);
    };
    lock.onchange = () => { b.locked = lock.checked; applyLock(); };
    div.querySelector(".remove").onclick = () => { bands.splice(i, 1); buildBands(); setView(view, false); full(); };
    for (const [key, label, min, max, step] of bandSliders) {
      const row = document.createElement("div");
      row.className = "row";
      row.innerHTML = `<label></label><output></output><input type="range" min="${min}" max="${max}" step="${step}">`;
      row.querySelector("label").textContent = label;
      const input = row.querySelector("input"), out = row.querySelector("output");
      b[key] ??= BAND_DEFAULTS[key];
      input.value = b[key]; out.textContent = bandText(key, b[key]);
      if (BAND_TIPS[key]) { input.title = BAND_TIPS[key]; row.querySelector("label").title = BAND_TIPS[key]; }
      input.setAttribute("aria-label", `Focus ${i + 1} ${label}`);
      input.style.accentColor = colour; out.style.color = colour;
      input.addEventListener("input", () => {
        b[key] = +input.value; out.textContent = bandText(key, input.value);
        if (key === "depth") showFold();
        if (key !== "strength") setView("highlight", false);   // where it lands; strength only shows in the result
        preview();
      });
      input.addEventListener("change", full);
      div.appendChild(row);
    }
    addSteppers(div);
    applyLock();
    box.appendChild(div);
  });
  $("focus_note").textContent = bands.length ? "" : "then click the picture";
}

function settings() {
  const s = { palette, invert: $("invert").checked, equalize: $("equalize").checked,
              focus_style: $("focus_style").value, focus: bands };
  for (const k of sliders) s[k] = parseFloat($(k).value);
  return s;
}
function showValues() { for (const k of sliders) $(k + "_v").textContent = fmt[k]($(k).value); }

async function getJSON(url, body) {
  const r = await fetch(url, body ? { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) } : {});
  const j = await r.json();
  if (!r.ok) throw new Error(j.error || r.statusText);
  return j;
}

// Rendering: previews while dragging (one in flight; the newest waits), full quality on release.
// Every request gets an increasing id; a response is shown only if nothing newer has been shown,
// and a preview is dropped once a full render has been asked for after it.
let reqId = 0, shownId = 0, fullAskedId = 0, previewBusy = false, previewWaiting = false, lastURL = null;
async function render(quality) {
  if (!$("map").value) return;
  if (quality === "preview" && previewBusy) { previewWaiting = true; return; }
  const id = ++reqId;
  if (quality === "full") fullAskedId = id; else previewBusy = true;
  $("status").textContent = quality === "full" ? "rendering…" : "preview…";
  try {
    const r = await fetch("/api/render", { method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ map: $("map").value, settings: settings(), quality, view }) });
    if (!r.ok) throw new Error((await r.json()).error);
    const blob = await r.blob();
    if (id < shownId || (quality === "preview" && fullAskedId > id)) return;
    shownId = id;
    if (lastURL) URL.revokeObjectURL(lastURL);
    lastURL = URL.createObjectURL(blob);
    $("view").src = lastURL; $("view").hidden = false; $("empty").hidden = true; $("below").hidden = false;
    $("status").textContent = `${view === "highlight" ? "highlights · " : ""}${quality} · ${r.headers.get("X-Size")} · ${r.headers.get("X-Render-Ms")} ms`;
  } catch (e) {
    $("status").textContent = "error: " + e.message;
  } finally {
    if (quality === "preview") {
      previewBusy = false;
      if (previewWaiting) { previewWaiting = false; render("preview"); }
    }
  }
}
let quiet = false;                                 // set while a step button updates a slider
const preview = () => { if (!quiet) render("preview"); };
const full = () => { previewWaiting = false; return render("full"); };   // a queued preview would replace it

function buildSwatches(list) {
  const box = $("swatches");
  box.innerHTML = "";
  for (const p of list) {
    const b = document.createElement("button");
    b.className = "swatch"; b.type = "button"; b.dataset.key = p.key; b.title = p.label;
    b.setAttribute("aria-pressed", p.key === palette);
    b.innerHTML = `<div class="bar" style="background:linear-gradient(90deg,${p.colours.join(",")})"></div><span class="name"></span>`;
    b.querySelector(".name").textContent = p.label;
    b.onclick = () => { selectPalette(p.key); full(); };
    box.appendChild(b);
  }
}
function selectPalette(key) {
  palette = key;
  for (const b of document.querySelectorAll(".swatch")) b.setAttribute("aria-pressed", b.dataset.key === key);
}

async function loadLooks() {
  const j = await getJSON("/api/looks");
  const sel = $("looks");
  sel.length = 1;
  for (const n of j.looks) sel.add(new Option(n, n));
}

async function init() {
  const [maps, pals] = await Promise.all([getJSON("/api/maps"), getJSON("/api/palettes")]);
  $("folder").textContent = maps.folder;
  for (const m of maps.maps) { const o = new Option(m, m); o.title = m; $("map").add(o); }
  $("map").selectedIndex = maps.maps.length ? 0 : -1;
  showTitle();
  buildSwatches(pals);
  addSteppers(document);
  buildBands();
  showValues();
  await loadLooks();
  if (maps.maps.length) full(); else $("empty").textContent = "No depth maps (.exr) in " + maps.folder;
}

for (const k of sliders) {
  $(k).addEventListener("input", () => { showValues(); if (k !== "supersample") preview(); });
  $(k).addEventListener("change", full);
}
for (const k of ["invert", "equalize"]) $(k).addEventListener("change", full);
function showTitle() { $("title").textContent = $("map").value; $("view").alt = $("map").value; }
$("map").addEventListener("change", () => {
  $("probe").textContent = ""; $("downloaded").textContent = "";
  showTitle();
  bands = []; buildBands(); setPicking(false); setView("result", false);   // focus depths belong to the old map
  full();
});
$("view").addEventListener("click", async (ev) => {
  if ($("pick").getAttribute("aria-pressed") !== "true") { $("stage").classList.toggle("actual"); return; }
  const r = $("view").getBoundingClientRect();
  const x = (ev.clientX - r.left) / r.width, y = (ev.clientY - r.top) / r.height;
  if (!ev.shiftKey) setPicking(false);
  try {
    const j = await getJSON("/api/depth_at", { map: $("map").value, settings: settings(), x, y });
    if (bands.length >= MAX_FOCUS) { $("focus_note").textContent = `${MAX_FOCUS} is the most: remove one first`; return; }
    if (bands.length >= 3) for (const o of bands) o.open = false;   // keep the list short: only the new one open
    bands.push({ depth: +j.depth.toFixed(3), width: 0.08, softness: 0.04, strength: 1, lean: 0, angle: 0,
                 x: +x.toFixed(4), y: +y.toFixed(4), enabled: true, open: true });
    if ($("focus_style").value === "off") $("focus_style").value = "white_on_black";
    buildBands(); setView("highlight", false); full();
  } catch (e) { $("focus_note").textContent = "pick failed: " + e.message; }
});
function setPicking(on) {
  $("pick").setAttribute("aria-pressed", on);
  $("view").classList.toggle("picking", on);
}
$("pick").onclick = () => setPicking($("pick").getAttribute("aria-pressed") !== "true");
$("focus_style").addEventListener("change", full);
for (const b of $("tabs").querySelectorAll("button")) b.onclick = () => setView(b.dataset.view);
document.addEventListener("keydown", (ev) => {
  const el = document.activeElement, typing = el && (el.type === "text" || el.tagName === "SELECT");
  if ((ev.key === "t" || ev.key === "T") && !ev.ctrlKey && !ev.metaKey && !ev.altKey && !typing && bands.length)
    setView(view === "result" ? "highlight" : "result");
});

$("auto").onclick = async () => {
  $("probe").textContent = "probing…";
  try {
    const pr = await getJSON("/api/probe", { map: $("map").value, settings: { ...settings(), smooth_auto: true } });
    $("smooth").value = pr.smooth_depth;
    if (+$("contours").value > 0) $("contours").value = pr.contours;
    if (+$("cycles").value > 0 || +$("contours").value === 0) $("cycles").value = pr.cycles;
    showValues();
    $("probe").textContent = `Most detail it carries cleanly: ${pr.cycles} cycles or ${pr.contours} contour lines`
      + ` (depth wobble ${pr.wobble.toFixed(5)}).` + (pr.suggest_equalize ? "\nDepth is bunched up: try Equalize." : "");
    full();
  } catch (e) { $("probe").textContent = "probe failed: " + e.message; }
};

$("looks").onchange = async () => {
  const name = $("looks").value;
  if (!name) return;
  try {
    const s = await getJSON("/api/look", { name });
    selectPalette(s.palette);
    $("invert").checked = s.invert; $("equalize").checked = s.equalize;
    for (const k of sliders) $(k).value = s[k] ?? $(k).value;
    $("focus_style").value = s.focus_style || "off";
    bands = (s.focus || []).map((b) => ({ ...b, open: s.focus.length <= 3 })); buildBands(); setView("result", false);
    showValues(); $("name").value = name; full();
  } catch (e) { $("saved").textContent = "load failed: " + e.message; }
};

$("save").onclick = async () => {
  $("saved").textContent = "saving…";
  try {
    const j = await getJSON("/api/save", { map: $("map").value, settings: settings(), name: $("name").value });
    $("saved").innerHTML = "";
    $("saved").append("Saved: ");
    for (const [label, url] of [["PNG", j.png_url], ["look", j.look_url]]) {
      const link = document.createElement("a");
      link.href = url; link.textContent = "download " + label; link.style.color = "var(--focus)";
      $("saved").append(link, "  ");
    }
    await loadLooks();
  } catch (e) { $("saved").textContent = "save failed: " + e.message; }
};

$("save_local").onclick = async () => {
  const btn = $("save_local");
  btn.disabled = true; $("downloaded").textContent = "saving the PNG…";
  try {
    const j = await getJSON("/api/save_local", { map: $("map").value, settings: settings(), name: $("name").value });
    $("downloaded").textContent = "Saved " + j.png;
  } catch (e) { $("downloaded").textContent = "save failed: " + e.message; }
  finally { btn.disabled = false; }
};
$("download").onclick = async () => {
  const btn = $("download");
  btn.disabled = true; $("downloaded").textContent = "rendering the PNG…";
  try {
    const r = await fetch("/api/export", { method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ map: $("map").value, settings: settings(), name: $("name").value }) });
    if (!r.ok) throw new Error((await r.json()).error);
    const name = (r.headers.get("Content-Disposition") || "").match(/filename="([^"]+)"/)?.[1] || "vathopy.png";
    const url = URL.createObjectURL(await r.blob());
    const a = document.createElement("a");
    a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 10000);
    $("downloaded").textContent = "Downloaded " + name;
  } catch (e) { $("downloaded").textContent = "download failed: " + e.message; }
  finally { btn.disabled = false; }
};

// Collapsible sidebar sections: a ▾/▸ on the left of each heading, remembered in this browser.
const COLLAPSED_KEY = "vathopy.collapsed";
let collapsed = {};
try { collapsed = JSON.parse(localStorage.getItem(COLLAPSED_KEY) || "{}") || {}; } catch { collapsed = {}; }
for (const h of document.querySelectorAll("aside h2")) {
  const name = h.textContent.trim();
  const body = document.createElement("div");
  body.className = "section";
  while (h.nextElementSibling && h.nextElementSibling.tagName !== "H2") body.appendChild(h.nextElementSibling);
  h.after(body);
  const btn = document.createElement("button");
  btn.type = "button"; btn.className = "sec";
  btn.innerHTML = `<span class="tri" aria-hidden="true"></span>`;
  btn.append(name);
  h.replaceChildren(btn);
  const show = () => {
    const c = !!collapsed[name];
    body.hidden = c;
    btn.setAttribute("aria-expanded", !c);
    btn.title = c ? `Show ${name}` : `Hide ${name}`;
    btn.querySelector(".tri").textContent = c ? "▸" : "▾";
  };
  btn.onclick = () => {
    collapsed[name] = !collapsed[name];
    try { localStorage.setItem(COLLAPSED_KEY, JSON.stringify(collapsed)); } catch { /* not remembered */ }
    show();
  };
  show();
}

init().catch((e) => { $("empty").textContent = "error: " + e.message; });
</script>
</body>
</html>
