[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vathopy"
version = "0.1.0"
description = "Vathography pictures from depth maps without Blender (port of the Vathography Free add-on's picture maths)"
readme = "README.md"
license = "GPL-3.0-or-later"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "opencv-python-headless>=4.8", "OpenEXR>=3.3"]

[project.optional-dependencies]
test = ["pytest"]
examples = ["Pillow"]  # tools/make_examples.py

[project.scripts]
vathopy = "vathopy.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
vathopy = ["presets.json", "gui.html"]
